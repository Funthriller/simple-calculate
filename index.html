<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Calculator</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #f1f3f5;
      font-family: system-ui, sans-serif;
    }

    .calculator {
      width: min(320px, 92vw);
      padding: 20px;
      border-radius: 16px;
      background: #222;
      box-shadow: 0 12px 30px #0003;
    }

    #display {
      width: 100%;
      height: 72px;
      margin-bottom: 14px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #333;
      color: white;
      font: inherit;
      font-size: 2rem;
      text-align: right;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      min-height: 56px;
      border: 0;
      border-radius: 8px;
      background: #444;
      color: white;
      font: inherit;
      font-size: 1.2rem;
      cursor: pointer;
    }

    button:hover {
      background: #555;
    }

    button.operator {
      background: #f09a36;
    }

    button.operator:hover {
      background: #f5aa50;
    }

    button.action {
      background: #666;
    }

    button.equals {
      grid-column: span 2;
      background: #388e3c;
    }

    button.equals:hover {
      background: #43a047;
    }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <input id="display" type="text" value="0" aria-label="Display" readonly>

    <div class="buttons">
      <button class="action" data-action="clear">AC</button>
      <button class="action" data-action="delete">DEL</button>
      <button class="operator" data-value="/">÷</button>
      <button class="operator" data-value="*">×</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="-">−</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="+">+</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button data-value=".">.</button>

      <button data-value="0">0</button>
      <button class="equals" data-action="equals">=</button>
    </div>
  </main>

  <script>
    const display = document.querySelector("#display");
    const buttons = document.querySelector(".buttons");
    let expression = "";

    function updateDisplay(value = expression || "0") {
      display.value = value;
    }

    function calculate() {
      const match = expression.match(
        /^(-?\d*\.?\d+)\s*([+\-*/])\s*(-?\d*\.?\d+)$/
      );

      if (!match) return;

      const [, left, operator, right] = match;
      const a = Number(left);
      const b = Number(right);
      let result;

      switch (operator) {
        case "+": result = a + b; break;
        case "-": result = a - b; break;
        case "*": result = a * b; break;
        case "/":
          if (b === 0) {
            expression = "";
            updateDisplay("Cannot divide by zero");
            return;
          }
          result = a / b;
          break;
      }

      expression = String(Number(result.toPrecision(12)));
      updateDisplay();
    }

    buttons.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;

      const { action, value } = button.dataset;

      if (action === "clear") {
        expression = "";
        updateDisplay();
      } else if (action === "delete") {
        expression = expression.slice(0, -1);
        updateDisplay();
      } else if (action === "equals") {
        calculate();
      } else if (value) {
        if (display.value === "Cannot divide by zero") expression = "";

        const isOperator = ["+", "-", "*", "/"].includes(value);
        if (isOperator && !expression) {
          if (value !== "-") return;
        }

        expression += value;
        updateDisplay();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (/^[0-9.]$/.test(event.key)) {
        expression += event.key;
      } else if (["+", "-", "*", "/"].includes(event.key)) {
        expression += event.key;
      } else if (event.key === "Enter" || event.key === "=") {
        calculate();
      } else if (event.key === "Backspace") {
        expression = expression.slice(0, -1);
      } else if (event.key === "Escape") {
        expression = "";
      } else {
        return;
      }

      event.preventDefault();
      updateDisplay();
    });
  </script>
</body>
</html>
